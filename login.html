<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HitJamParty - Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #0b0c10; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-container { width: 100%; max-width: 400px; background: linear-gradient(180deg, #160c1b 0%, #0b0c10 100%); padding: 30px; box-sizing: border-box; border-radius: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.6); text-align: center; }
        .logo { font-size: 32px; font-weight: 900; background: linear-gradient(45deg, #ff2d55, #ff9500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-login { background: linear-gradient(90deg, #ff2d55, #ff9500); color: white; }
        .btn-register { background: #1f2026; color: white; border: 1px solid #33343f; }
        .msg { color: #ff2d55; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-container">
        <h1 class="logo">HitJamParty</h1>
        <p style="color: #aaa;">Log in of registreer gratis</p>
        
        <input type="text" id="username" placeholder="Gebruikersnaam">
        <input type="password" id="password" placeholder="Wachtwoord">
        
        <button class="btn btn-login" onclick="handleLogin()">Inloggen</button>
        <button class="btn btn-register" onclick="handleRegister()">Registreren</button>
        
        <div id="errorMsg" class="msg"></div>
    </div>

    <script>
        // Registreer functie: Slaat account op in de browser van de gebruiker
        function handleRegister() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const msg = document.getElementById('errorMsg');

            if(!user || !pass) { msg.innerText = "Vul alle velden in."; return; }

            let gebruikers = JSON.parse(localStorage.getItem('hj_users')) || {};
            
            if(gebruikers[user]) {
                msg.innerText = "Deze gebruikersnaam bestaat al!";
            } else {
                gebruikers[user] = pass;
                localStorage.setItem('hj_users', JSON.stringify(gebruikers));
                msg.style.color = "#00ffcc";
                msg.innerText = "Registratie succesvol! Je kunt nu inloggen.";
            }
        }

        // Inlog functie: Controleert de gegevens en start de 'sessie'
        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const msg = document.getElementById('errorMsg');

            let gebruikers = JSON.parse(localStorage.getItem('hj_users')) || {};

            if(gebruikers[user] && gebruikers[user] === pass) {
                // Sla de ingelogde gebruiker op (vervangt $_SESSION['loggedin'])
                localStorage.setItem('hj_current_user', user);
                window.location.href = "index.html";
            } else {
                msg.style.color = "#ff2d55";
                msg.innerText = "Onjuiste gebruikersnaam of wachtwoord.";
            }
        }

        // Als je al ingelogd bent, ga direct naar het spel
        if(localStorage.getItem('hj_current_user')) {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
