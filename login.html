<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HitJamParty - Starten</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #0b0c10; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-container { width: 100%; max-width: 400px; background: linear-gradient(180deg, #160c1b 0%, #0b0c10 100%); padding: 30px; box-sizing: border-box; border-radius: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.6); text-align: center; }
        .logo { font-size: 32px; font-weight: 900; background: linear-gradient(45deg, #ff2d55, #ff9500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; text-align: center; font-size: 16px; }
        .btn { width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-start { background: linear-gradient(90deg, #ff2d55, #ff9500); color: white; }
        .msg { color: #ff2d55; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-container">
        <h1 class="logo">HitJamParty</h1>
        <p style="color: #aaa;">Vul je naam in om te spelen</p>
        
        <input type="text" id="username" placeholder="Jouw Speelnaam" maxlength="15">
        
        <button class="btn btn-start" onclick="opslaanEnStarten()">Start Spel 🎉</button>
        
        <div id="errorMsg" class="msg"></div>
    </div>

    <script>
        function opslaanEnStarten() {
            const user = document.getElementById('username').value.trim();
            const msg = document.getElementById('errorMsg');

            if(!user) { 
                msg.innerText = "Vul eerst een naam in om te kunnen starten."; 
                return; 
            }

            // Sla alleen de naam op (volledig veilig, geen wachtwoord nodig)
            localStorage.setItem('hj_current_user', user);
            window.location.href = "index.html";
        }

        // Als de speler al een bekende naam heeft, sturen we die direct door naar het spel
        if(localStorage.getItem('hj_current_user')) {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
